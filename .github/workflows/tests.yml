name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[mcp,dev,eval]"
      - run: python -m pytest -q
      - name: Validate example models
        run: mbse -m data check

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Fetch the pinned OMG SysML v2 release
        run: python tools/conformance.py fetch
      - name: Conformance ratchet (no regression vs tools/conformance_baseline.json)
        run: python tools/conformance.py check
