<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBSE Workbench</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --border: #dde1e7; --text: #1d2330; --muted: #6b7385;
  --accent: #2f6fde; --accent-soft: #e6eefc; --danger: #c93b3b; --warn: #b7791f; --ok: #2f855a;
  --pkg: #7c5cc4; --def: #2f6fde; --use: #138a72; --req: #c05621;
  --diagram-bg: #fbfcfd; --box: #ffffff; --box-head: #eef3fb; --line: #4a5568;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1b1f26; --border: #2c323c; --text: #e3e7ee; --muted: #8d96a7;
    --accent: #6c9ef5; --accent-soft: #233148; --danger: #f07171; --warn: #e0b050; --ok: #5fc497;
    --pkg: #a990f0; --def: #6c9ef5; --use: #4cc7aa; --req: #f0a060;
    --diagram-bg: #171a20; --box: #1f242c; --box-head: #263142; --line: #a0aec0;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
header .spacer { flex: 1; }
.badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; background: var(--accent-soft); cursor: pointer; }
.badge.err { color: var(--danger); } .badge.warn { color: var(--warn); } .badge.ok { color: var(--ok); }
button { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--danger); }
input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; width: 100%; }
textarea { resize: vertical; min-height: 60px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
main { display: grid; grid-template-columns: 270px 1fr 320px; height: calc(100vh - 45px); }
aside, section { overflow: auto; }
aside.left { border-right: 1px solid var(--border); background: var(--panel); padding: 8px 0; }
aside.right { border-left: 1px solid var(--border); background: var(--panel); padding: 12px; }
.tree-search { margin: 0 8px 8px; width: calc(100% - 16px); }
#results { margin: 0 8px 8px; }
#results .res { display: flex; gap: 6px; align-items: center; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
#results .res:hover { background: var(--accent-soft); }
#results .score { margin-left: auto; color: var(--muted); font-size: 11px; }
#results .head { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; padding: 0 6px 4px; }
.tree ul { list-style: none; margin: 0; padding-left: 14px; }
.tree > ul { padding-left: 4px; }
.tree li > .row { display: flex; align-items: center; gap: 5px; padding: 1px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.tree li > .row:hover { background: var(--accent-soft); }
.tree li > .row.sel { background: var(--accent); color: #fff; }
.tree .twisty { width: 12px; color: var(--muted); font-size: 10px; flex: none; text-align: center; }
.tree .type { color: var(--muted); }
.row.sel .type { color: #dde6ff; }
.icon { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 3px; font-size: 10px; font-weight: 700; color: #fff; flex: none; }
.icon.pkg { background: var(--pkg); } .icon.def { background: var(--def); } .icon.use { background: var(--use); } .icon.req { background: var(--req); }
.tabs { display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 2; }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 12px; }
.tabs button.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
.pane { padding: 14px; }
.diagram-wrap { background: var(--diagram-bg); border: 1px solid var(--border); border-radius: 8px; overflow: auto; }
.diagram-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 12px; }
svg text { fill: var(--text); font-size: 12px; }
svg .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
svg .box.sel { stroke: var(--accent); stroke-width: 2.2; }
svg .head { fill: var(--box-head); }
svg .frame { fill: none; stroke: var(--line); stroke-width: 1.2; }
svg .port { fill: var(--box); stroke: var(--line); stroke-width: 1.2; cursor: crosshair; }
svg .port.pending { fill: var(--accent); }
svg .conn { fill: none; stroke: var(--line); stroke-width: 1.4; }
svg .conn:hover { stroke: var(--danger); stroke-width: 2.5; cursor: pointer; }
svg .stereo { fill: var(--muted); font-size: 10.5px; }
svg .feat { font-size: 11.5px; }
svg .clickable { cursor: pointer; }
h2 { font-size: 13px; margin: 0 0 10px; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
.field { margin-bottom: 8px; } .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.kv { color: var(--muted); font-size: 12px; word-break: break-all; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.msg { margin-top: 8px; padding: 6px 8px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.msg.err { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.msg.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 9px; background: var(--accent-soft); margin: 1px 3px 1px 0; cursor: pointer; font-size: 12px; }
.chip .x { margin-left: 4px; color: var(--danger); }
.diag { padding: 6px 8px; border-left: 3px solid var(--border); margin-bottom: 6px; cursor: pointer; background: var(--panel); border-radius: 4px; }
.diag.error { border-color: var(--danger); } .diag.warning { border-color: var(--warn); } .diag.info { border-color: var(--accent); }
.diag .code { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); }
pre.src { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto; font-size: 12px; }
.member-list div { padding: 2px 0; cursor: pointer; } .member-list div:hover { color: var(--accent); }
.empty { color: var(--muted); padding: 20px; text-align: center; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } aside.left, aside.right { max-height: 45vh; } }
</style>
</head>
<body>
<header>
  <h1>MBSE Workbench</h1>
  <span class="hint" id="docs"></span>
  <span class="spacer"></span>
  <span class="badge" id="vbadge" title="Validation"></span>
  <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="redo" title="Redo (Ctrl+Y)">Redo</button>
  <button id="reload" title="Reload model from disk">Reload</button>
</header>
<main>
  <aside class="left">
    <input class="tree-search" id="search" placeholder="Filter, or Enter to search by meaning…" title="Type to filter names; press Enter for a semantic search (any language)">
    <div id="results"></div>
    <div class="tree" id="tree"></div>
  </aside>
  <section>
    <div class="tabs" id="tabs">
      <button data-tab="ibd" class="active">Internal structure</button>
      <button data-tab="bdd">Definitions</button>
      <button data-tab="req">Requirements</button>
      <button data-tab="impact">Impact</button>
      <button data-tab="valid">Validation</button>
      <button data-tab="src">Source</button>
    </div>
    <div class="pane" id="pane"></div>
  </section>
  <aside class="right" id="props"></aside>
</main>
<script>
"use strict";
const S = { model: null, byId: {}, sel: null, tab: "ibd", expanded: new Set(), pendingPort: null, filter: "", lastMsg: null };
const KINDS = ["package","part def","part","port def","port","attribute def","attribute","item def","item","action def","action","state def","state","requirement def","requirement","constraint def","constraint","interface def","interface","enum def","enum","use case def","use case","allocation def","allocation","occurrence def","occurrence","calc def","calc","verification def","verification","analysis def","analysis","view def","view","viewpoint def","viewpoint","concern def","concern","connection def","connection"];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
const svgNS = "http://www.w3.org/2000/svg";
function s(tag, attrs = {}, text) {
  const el = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, v);
  if (text != null) el.textContent = text;
  return el;
}

async function api(op, args = {}) {
  const r = await fetch("/api/call", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ op, args }) });
  return r.json();
}
async function mutate(op, args, okText) {
  const res = await api(op, args);
  if (!res.ok) { S.lastMsg = { err: true, text: formatError(res.error) }; renderProps(); return res; }
  S.lastMsg = okText ? { err: false, text: okText } : null;
  await refresh();
  return res;
}
function formatError(e) {
  let t = `${e.message}`;
  if (e.suggestions?.length) t += `\nSuggestions: ${e.suggestions.join(", ")}`;
  if (Array.isArray(e.details)) t += "\n" + e.details.map(d => "• " + (d.in ? `${d.in} (${d.role}: ${d.ref})` : JSON.stringify(d))).join("\n");
  return t;
}

// Split an element id into name segments, honouring 'quoted names'.
function segments(id) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < id.length; i++) {
    const c = id[i];
    if (q) { if (c === "\\") { cur += id[++i]; } else if (c === "'") q = false; else cur += c; }
    else if (c === "'") q = true;
    else if (c === ".") { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur); return out;
}

async function refresh() {
  const m = await api("export_model");
  if (!m.ok) { $("#pane").textContent = formatError(m.error); return; }
  S.model = m; S.byId = {};
  for (const e of m.elements) S.byId[e.id] = e;
  if (S.sel && !S.byId[S.sel]) S.sel = null;
  if (!S.sel && m.documents[0]?.roots[0]) select(m.documents[0].roots[0], false);
  if (S.expanded.size === 0) m.documents.forEach(d => d.roots.forEach(r => S.expanded.add(r)));
  renderHeader(); renderTree(); renderPane(); renderProps();
}

function select(id, rerender = true) {
  S.sel = id; S.lastMsg = null;
  let e = S.byId[id];
  while (e && e.owner) { S.expanded.add(e.owner); e = S.byId[e.owner]; }
  if (rerender) { renderTree(); renderPane(); renderProps(); }
}

function iconFor(e) {
  if (e.keyword === "package") return h("span", { class: "icon pkg" }, "P");
  if (e.keyword === "requirement") return h("span", { class: "icon req" }, "R");
  return h("span", { class: "icon " + (e.is_definition ? "def" : "use") }, e.is_definition ? "D" : "U");
}
function typeLabel(e) {
  let t = "";
  if (e.type_refs) t += " : " + e.type_refs.join(", ");
  if (e.multiplicity) t += ` [${e.multiplicity}]`;
  if (e.value_text) t += " = " + e.value_text;
  return t;
}

function renderHeader() {
  const v = S.model.validation, b = $("#vbadge");
  b.className = "badge " + (v.errors ? "err" : v.warnings ? "warn" : "ok");
  b.textContent = v.errors || v.warnings ? `${v.errors} errors · ${v.warnings} warnings` : "Model valid";
  $("#undo").disabled = !S.model.can_undo; $("#redo").disabled = !S.model.can_redo;
  $("#docs").textContent = S.model.documents.map(d => d.path).join(", ");
}

function renderTree() {
  const f = S.filter.toLowerCase();
  const matches = (e) => !f || (e.name || "").toLowerCase().includes(f) || e.members.some(m => S.byId[m] && matches(S.byId[m]));
  const node = (id) => {
    const e = S.byId[id]; if (!e || !matches(e)) return null;
    const open = f || S.expanded.has(id);
    const kids = e.members.length;
    const row = h("div", { class: "row" + (S.sel === id ? " sel" : ""), title: e.id, onclick: () => select(id) },
      h("span", { class: "twisty", onclick: (ev) => { ev.stopPropagation(); open ? S.expanded.delete(id) : S.expanded.add(id); renderTree(); } }, kids ? (open ? "▾" : "▸") : ""),
      iconFor(e), h("span", {}, e.name), h("span", { class: "type" }, typeLabel(e)));
    return h("li", {}, row, kids && open ? h("ul", {}, e.members.map(node)) : null);
  };
  const t = $("#tree"); t.replaceChildren();
  for (const d of S.model.documents) t.append(h("ul", {}, d.roots.map(node)));
}

// ------------------------------------------------------------------ tabs
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x === b));
  S.tab = b.dataset.tab; S.pendingPort = null; renderPane();
});
function renderPane() {
  const p = $("#pane"); p.replaceChildren();
  if (!S.model) return;
  ({ ibd: renderIBD, bdd: renderBDD, req: renderReq, impact: renderImpact, valid: renderValid, src: renderSrc })[S.tab](p);
}

// ------------------------------------------------- internal block diagram
function definitionOf(e) {
  if (!e) return null;
  if (e.is_definition) return e;
  if (e.types && e.types[0] && S.byId[e.types[0]]) return S.byId[e.types[0]];
  return e; // untyped usage: show its own members
}
function featuresOf(e, keywords) {
  // own members + inherited features, as {name, id, kind}
  const out = [];
  if (!e) return out;
  for (const mid of e.members) { const m = S.byId[mid]; if (m && keywords.includes(m.keyword) && !m.is_definition) out.push({ name: m.name, id: m.id, el: m }); }
  for (const f of e.inherited_features || []) if (keywords.map(k => k[0].toUpperCase() + k.slice(1) + "Usage").includes(f.kind)) out.push({ name: f.name, id: f.id, el: S.byId[f.id] });
  return out;
}
function ibdContext() {
  let e = S.byId[S.sel];
  while (e) {
    const parts = featuresOf(e, ["part", "item"]);
    if (parts.length || e.is_definition) return e;
    e = S.byId[e.owner];
  }
  return null;
}
function renderIBD(p) {
  const ctx = ibdContext();
  if (!ctx) { p.append(h("div", { class: "empty" }, "Select a part definition or part to see its internal structure.")); return; }
  const parts = featuresOf(ctx, ["part", "item"]);
  const ctxPorts = featuresOf(ctx, ["port"]);
  const stmts = S.model.statements.filter(st => st.kind === "connect" && st.owner === ctx.id && st.source && st.target);
  const prefix = segments(ctx.id).length;
  const ends = stmts.map(st => [segments(st.source).slice(prefix), segments(st.target).slice(prefix), st]);

  p.append(h("div", { class: "diagram-bar" },
    h("strong", {}, `ibd [${ctx.keyword}${ctx.is_definition ? " def" : ""}] ${ctx.name}`),
    h("span", { class: "hint" }, S.pendingPort ? `Connecting from ${S.pendingPort.join(".")} — click a target port (Esc to cancel)` : "Click a port, then another port, to connect them. Click a connection to delete it.")));

  // grid placement first, then each connected port goes on the side facing its counterpart
  const W = 190, gapX = 120, gapY = 50, pad = 50;
  const cols = Math.max(1, Math.min(3, Math.ceil(Math.sqrt(parts.length))));
  const cell = {}; parts.forEach((pt, i) => cell[pt.name] = { col: i % cols, row: Math.floor(i / cols) });
  const side = {};
  const face = (mine, other) => {
    if (mine.length < 2) return "R";               // a port of the context, on the frame
    const a = cell[mine[0]], b = other.length < 2 ? { col: -1, row: 0 } : cell[other[0]];
    if (!a || !b) return null;
    return b.col > a.col ? "R" : b.col < a.col ? "L" : "R";
  };
  for (const [a, b] of ends) { side[a.join(".")] ??= face(a, b); side[b.join(".")] ??= face(b, a); }
  const boxes = parts.map((pt, i) => {
    const def = definitionOf(pt.el);
    const ports = featuresOf(def === pt.el ? pt.el : def, ["port"]).concat(def !== pt.el ? featuresOf(pt.el, ["port"]).filter(x => !featuresOf(def, ["port"]).some(y => y.name === x.name)) : []);
    const L = [], R = [];
    ports.forEach((pp, j) => { const key = pt.name + "." + pp.name; const sd = side[key] || (j % 2 ? "R" : "L"); (sd === "L" ? L : R).push(pp); });
    const hgt = Math.max(70, 46 + 22 * Math.max(L.length, R.length));
    return { pt, def, L, R, hgt, ...cell[pt.name] };
  });
  const rowH = []; boxes.forEach(b => rowH[b.row] = Math.max(rowH[b.row] || 0, b.hgt));
  const rowY = []; let acc = pad + 40; rowH.forEach((hh, r) => { rowY[r] = acc; acc += hh + gapY; });
  const width = Math.max(560, pad * 2 + cols * W + (cols - 1) * gapX + 40);
  const height = Math.max(260, acc + 10);
  const svg = s("svg", { width, height, viewBox: `0 0 ${width} ${height}` });
  svg.append(s("rect", { class: "frame", x: 15, y: 15, width: width - 30, height: height - 30, rx: 6 }));
  svg.append(s("text", { x: 28, y: 36, "font-weight": 600 }, `${ctx.name}`));

  const portPos = {};
  const portLayer = s("g"); // drawn last so ports stay clickable above connections
  const portEl = (key, x, y, label, anchor) => {
    const r = s("rect", { class: "port" + (S.pendingPort?.join(".") === key ? " pending" : ""), x: x - 6, y: y - 6, width: 12, height: 12 });
    r.addEventListener("click", (ev) => { ev.stopPropagation(); portClick(ctx, key.split(".")); });
    r.append(s("title", {}, key));
    portLayer.append(r);
    portLayer.append(s("text", { x: anchor === "start" ? x + 10 : x - 10, y: y + 4, "text-anchor": anchor, class: "feat" }, label));
    portPos[key] = { x, y, d: anchor === "start" && x > 20 ? -1 : 1 };
  };
  // ports of the context itself, on the frame
  ctxPorts.forEach((pp, j) => portEl(pp.name, 15, 70 + j * 26, pp.name, "start"));
  boxes.forEach(b => {
    const x = pad + b.col * (W + gapX) + 20, y = rowY[b.row];
    b.x = x; b.y = y;
    const g = s("g", { class: "clickable" });
    g.append(s("rect", { class: "box" + (S.sel === b.pt.id ? " sel" : ""), x, y, width: W, height: b.hgt, rx: 4 }));
    g.append(s("rect", { class: "head", x: x + 1, y: y + 1, width: W - 2, height: 34, rx: 3 }));
    g.append(s("text", { x: x + W / 2, y: y + 14, "text-anchor": "middle", class: "stereo" }, `«${b.pt.el?.keyword || "part"}»`));
    const label = `${b.pt.name}${b.pt.el?.type_refs ? " : " + b.pt.el.type_refs[0] : ""}${b.pt.el?.multiplicity ? ` [${b.pt.el.multiplicity}]` : ""}`;
    g.append(s("text", { x: x + W / 2, y: y + 29, "text-anchor": "middle", "font-weight": 600 }, label.length > 28 ? label.slice(0, 27) + "…" : label));
    g.addEventListener("click", () => b.pt.el && select(b.pt.id));
    svg.append(g);
    b.L.forEach((pp, j) => portEl(`${b.pt.name}.${pp.name}`, x, y + 52 + j * 22, pp.name, "start"));
    b.R.forEach((pp, j) => portEl(`${b.pt.name}.${pp.name}`, x + W, y + 52 + j * 22, pp.name, "end"));
  });
  for (const [a, b, st] of ends) {
    const A = portPos[a.join(".")], B = portPos[b.join(".")];
    if (!A || !B) continue;
    const dx = Math.max(50, Math.abs(B.x - A.x) / 2);
    const path = s("path", { class: "conn", d: `M${A.x},${A.y} C${A.x + A.d * dx},${A.y} ${B.x + B.d * dx},${B.y} ${B.x},${B.y}` });
    path.append(s("title", {}, st.text + " — click to delete"));
    path.addEventListener("click", () => {
      if (confirm(`Delete "${st.text}"?`)) mutate("remove_relationship", { kind: "connect", source: st.source, target: st.target }, "Connection removed");
    });
    svg.append(path);
  }
  svg.append(portLayer);
  if (!parts.length) svg.append(s("text", { x: 40, y: 80, class: "stereo" }, "No parts yet — add a part in the properties panel."));
  p.append(h("div", { class: "diagram-wrap" }, svg));
}
function portClick(ctx, chain) {
  if (!S.pendingPort) { S.pendingPort = chain; renderPane(); return; }
  const from = S.pendingPort; S.pendingPort = null;
  if (from.join(".") === chain.join(".")) { renderPane(); return; }
  const idOf = (c) => ctx.id + "." + c.map(n => /^[A-Za-z_]\w*$/.test(n) ? n : `'${n.replace(/\\/g, "\\\\").replace(/'/g, "\\'")}'`).join(".");
  mutate("add_relationship", { kind: "connect", source: idOf(from), target: idOf(chain), owner: ctx.id }, "Connected");
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.pendingPort) { S.pendingPort = null; renderPane(); }
  if ((e.ctrlKey || e.metaKey) && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
    if (e.key === "z") { e.preventDefault(); doUndo(); }
    if (e.key === "y") { e.preventDefault(); doRedo(); }
  }
});

// ---------------------------------------------------- definitions diagram
function renderBDD(p) {
  let pkg = S.byId[S.sel];
  while (pkg && pkg.keyword !== "package") pkg = S.byId[pkg.owner];
  const pool = pkg ? pkg.members.map(id => S.byId[id]) : S.model.elements.filter(e => !e.owner);
  const defs = pool.filter(e => e && e.is_definition);
  p.append(h("div", { class: "diagram-bar" }, h("strong", {}, `bdd [package] ${pkg ? pkg.name : "(top level)"}`),
    h("span", { class: "hint" }, "Composition (◆) from part usages, specialization (△) from :>. Click a block to select it.")));
  if (!defs.length) { p.append(h("div", { class: "empty" }, "No definitions in this package.")); return; }
  const inSet = new Set(defs.map(d => d.id));
  const edges = [];
  for (const d of defs) {
    for (const sup of d.specializes || []) if (inSet.has(sup)) edges.push({ kind: "spec", from: d.id, to: sup });
    for (const mid of d.members) {
      const m = S.byId[mid];
      if (m && !m.is_definition && ["part", "item"].includes(m.keyword) && m.types?.[0] && inSet.has(m.types[0]))
        edges.push({ kind: "comp", from: d.id, to: m.types[0], label: m.name + (m.multiplicity ? ` [${m.multiplicity}]` : "") });
    }
  }
  // layering: owners above their parts, supertypes above subtypes
  const level = {}; defs.forEach(d => level[d.id] = 0);
  for (let it = 0; it < defs.length; it++) {
    let changed = false;
    for (const e of edges) {
      const [top, bottom] = e.kind === "comp" ? [e.from, e.to] : [e.to, e.from];
      if (top !== bottom && level[bottom] < level[top] + 1) { level[bottom] = level[top] + 1; changed = true; }
    }
    if (!changed) break;
  }
  const layered = []; defs.forEach(d => (layered[level[d.id]] ??= []).push(d));
  const rows = []; layered.forEach(r => { if (!r) return; for (let i = 0; i < r.length; i += 4) rows.push(r.slice(i, i + 4)); });
  const W = 200, gapX = 40, gapY = 70, pad = 30;
  const box = {};
  let y = pad, maxW = 0;
  rows.forEach(row => {
    if (!row) return;
    let x = pad, rh = 0;
    row.forEach(d => {
      const feats = d.members.map(id => S.byId[id]).filter(m => m && !m.is_definition);
      const hh = 42 + Math.max(1, feats.length) * 16 + 8;
      box[d.id] = { x, y, w: W, h: hh, d, feats };
      x += W + gapX; rh = Math.max(rh, hh);
    });
    maxW = Math.max(maxW, x); y += rh + gapY;
  });
  const width = Math.max(560, maxW + pad), height = y + pad;
  const svg = s("svg", { width, height, viewBox: `0 0 ${width} ${height}` });
  const defsEl = s("defs");
  defsEl.append(Object.assign(s("marker", { id: "tri", viewBox: "0 0 12 12", refX: 11, refY: 6, markerWidth: 12, markerHeight: 12, orient: "auto" }), {}));
  defsEl.lastChild.append(s("path", { d: "M0,0 L12,6 L0,12 z", fill: "var(--box)", stroke: "var(--line)" }));
  defsEl.append(s("marker", { id: "dia", viewBox: "0 0 16 10", refX: 1, refY: 5, markerWidth: 16, markerHeight: 10, orient: "auto" }));
  defsEl.lastChild.append(s("path", { d: "M0,5 L8,0 L16,5 L8,10 z", fill: "var(--line)" }));
  svg.append(defsEl);
  for (const e of edges) {
    const A = box[e.from], B = box[e.to]; if (!A || !B) continue;
    const [p1, p2] = e.kind === "comp"
      ? [{ x: A.x + A.w / 2, y: A.y + A.h }, { x: B.x + B.w / 2, y: B.y }]
      : [{ x: A.x + A.w / 2, y: A.y }, { x: B.x + B.w / 2, y: B.y + B.h }];
    const line = s("line", { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, class: "conn",
      "marker-start": e.kind === "comp" ? "url(#dia)" : null, "marker-end": e.kind === "spec" ? "url(#tri)" : null,
    });
    svg.append(line);
    if (e.label) svg.append(s("text", { x: (p1.x + p2.x) / 2 + 6, y: (p1.y + p2.y) / 2, class: "stereo" }, e.label));
  }
  for (const b of Object.values(box)) {
    const g = s("g", { class: "clickable" });
    g.append(s("rect", { class: "box" + (S.sel === b.d.id ? " sel" : ""), x: b.x, y: b.y, width: b.w, height: b.h, rx: 4 }));
    g.append(s("rect", { class: "head", x: b.x + 1, y: b.y + 1, width: b.w - 2, height: 34, rx: 3 }));
    g.append(s("text", { x: b.x + b.w / 2, y: b.y + 14, "text-anchor": "middle", class: "stereo" }, `«${b.d.abstract ? "abstract " : ""}${b.d.keyword} def»`));
    g.append(s("text", { x: b.x + b.w / 2, y: b.y + 29, "text-anchor": "middle", "font-weight": 600 }, b.d.name));
    b.feats.slice(0, 30).forEach((f, i) => g.append(s("text", { x: b.x + 8, y: b.y + 52 + i * 16, class: "feat" }, `${f.keyword} ${f.name}${typeLabel(f)}`.slice(0, 32))));
    g.addEventListener("click", () => select(b.d.id));
    svg.append(g);
  }
  p.append(h("div", { class: "diagram-wrap" }, svg));
}

// ----------------------------------------------------------- requirements
function renderReq(p) {
  const reqs = S.model.elements.filter(e => e.keyword === "requirement");
  const sat = S.model.statements.filter(st => st.kind === "satisfy");
  const candidates = S.model.elements.filter(e => !e.is_definition && e.keyword !== "package" && e.keyword !== "requirement");
  const covered = reqs.filter(r => sat.some(st => st.target === r.id)).length;
  p.append(h("h2", {}, `Requirements — ${covered}/${reqs.length} satisfied`));
  if (!reqs.length) { p.append(h("div", { class: "empty" }, "No requirements yet. Create one with kind 'requirement def'.")); return; }
  const tbody = h("tbody");
  for (const r of reqs) {
    const by = sat.filter(st => st.target === r.id);
    const sel = h("select", {}, h("option", { value: "" }, "+ satisfied by…"), candidates.map(c => h("option", { value: c.id }, c.id)));
    sel.onchange = () => sel.value && mutate("add_relationship", { kind: "satisfy", source: sel.value, target: r.id }, "Satisfy link added");
    tbody.append(h("tr", {},
      h("td", {}, h("span", { class: "chip", onclick: () => select(r.id) }, r.name)),
      h("td", {}, r.doc || h("span", { class: "hint" }, "(no text)")),
      h("td", {}, by.map(st => h("span", { class: "chip", title: st.text },
        h("span", { onclick: () => S.byId[st.source] && select(st.source) }, st.source.split(".").slice(-2).join(".")),
        h("span", { class: "x", title: "remove", onclick: () => mutate("remove_relationship", { kind: "satisfy", source: st.source, target: r.id }, "Removed") }, "×"))),
        by.length ? null : h("span", { style: "color:var(--danger)" }, "not satisfied "), sel)));
  }
  p.append(h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Requirement"), h("th", {}, "Text"), h("th", {}, "Satisfied by"))), tbody));
}

// ----------------------------------------------------------------- impact
async function renderImpact(p) {
  if (!S.sel) { p.append(h("div", { class: "empty" }, "Select an element.")); return; }
  const dir = h("select", { style: "width:auto" }, ["dependents", "dependencies", "both"].map(d => h("option", { value: d }, d)));
  dir.value = S.impactDir || "dependents";
  const hops = h("input", { type: "number", min: 1, max: 10, value: S.impactHops || 3, style: "width:70px" });
  const out = h("div");
  const run = async () => {
    S.impactDir = dir.value; S.impactHops = +hops.value;
    const r = await api("impact_analysis", { element: S.sel, direction: dir.value, max_hops: +hops.value });
    out.replaceChildren();
    if (!r.ok) { out.append(h("div", { class: "msg err" }, formatError(r.error))); return; }
    if (!r.impacted.length) { out.append(h("div", { class: "empty" }, "Nothing impacted.")); return; }
    const tb = h("tbody");
    r.impacted.forEach(i => tb.append(h("tr", {}, h("td", {}, i.distance), h("td", {}, h("span", { class: "chip", onclick: () => select(i.id) }, i.id)), h("td", {}, i.kind), h("td", { class: "hint" }, i.because.join("\n")))));
    out.append(h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Hops"), h("th", {}, "Element"), h("th", {}, "Kind"), h("th", {}, "Because"))), tb));
  };
  dir.onchange = run; hops.onchange = run;
  p.append(h("div", { class: "diagram-bar" }, h("strong", {}, `Impact of ${S.sel}`), dir, hops, h("span", { class: "hint" }, "max hops")), out);
  run();
}

// ------------------------------------------------------------- validation
function renderValid(p) {
  const d = S.model.diagnostics;
  p.append(h("h2", {}, `${S.model.validation.errors} errors, ${S.model.validation.warnings} warnings, ${d.length} diagnostics`));
  if (!d.length) { p.append(h("div", { class: "empty" }, "No issues found.")); return; }
  d.forEach(x => p.append(h("div", { class: "diag " + x.severity, onclick: () => x.element && S.byId[x.element] && select(x.element) },
    h("div", { class: "code" }, `${x.severity} · ${x.code}`), h("div", {}, x.message),
    x.suggestions ? h("div", { class: "hint" }, "Suggestions: " + x.suggestions.join(", ")) : null)));
}

// ----------------------------------------------------------------- source
async function renderSrc(p) {
  const r = S.sel ? await api("get_source", { element: S.sel }) : await api("get_source");
  const text = r.ok ? (r.source ?? r.documents.map(d => `// ${d.path}\n${d.source}`).join("\n")) : formatError(r.error);
  const snippet = h("textarea", { rows: 6, placeholder: "part def Wheel {\n    attribute radius : Real;\n}" });
  const msg = h("div");
  p.append(h("h2", {}, S.sel ? `Source of ${S.sel}` : "Source"), h("pre", { class: "src" }, text),
    h("h3", {}, `Add SysML v2 text inside ${S.sel || "the top level"}`), snippet,
    h("div", { class: "actions" }, h("button", { class: "primary", onclick: async () => {
      const res = await api("add_from_text", { text: snippet.value, owner: S.sel });
      if (!res.ok) { msg.replaceChildren(h("div", { class: "msg err" }, formatError(res.error))); return; }
      await refresh();
    } }, "Add")), msg);
}

// ------------------------------------------------------------- properties
function compatibleTypes(e) {
  const rules = { part: ["part", "item", "occurrence"], item: ["item", "part", "occurrence"], attribute: ["attribute", "enum"], port: ["port"], action: ["action", "calc"], requirement: ["requirement", "concern"], interface: ["interface", "connection"], connection: ["connection", "interface"] };
  const allowed = rules[e.keyword] || [e.keyword];
  const user = S.model.elements.filter(d => d.is_definition && allowed.includes(d.keyword)).map(d => d.id);
  const builtin = e.keyword === "attribute" ? ["Real", "Integer", "Natural", "Boolean", "String"] : [];
  return [...user, ...builtin];
}
function renderProps() {
  const P = $("#props"); P.replaceChildren();
  const e = S.byId[S.sel];
  if (!e) { P.append(h("div", { class: "empty" }, "Nothing selected")); return; }
  const f = {};
  const field = (label, input) => h("div", { class: "field" }, h("label", {}, label), input);
  P.append(h("h2", {}, iconFor(e), " ", e.name), h("div", { class: "kv" }, `${e.kind} · ${e.id}`));
  f.name = h("input", { value: e.name || "" });
  P.append(h("h3", {}, "Properties"), field("Name", f.name));
  if (!e.is_definition && e.keyword !== "package") {
    f.type = h("select", {}, h("option", { value: "" }, "(none)"), compatibleTypes(e).map(t => h("option", { value: t }, t)));
    f.type.value = e.types?.[0] || "";
    if (e.types?.[0] && f.type.value !== e.types[0]) { f.type.append(h("option", { value: e.types[0] }, e.types[0])); f.type.value = e.types[0]; }
    f.mult = h("input", { value: e.multiplicity || "", placeholder: "e.g. 1, 0..1, 1..*" });
    f.dir = h("select", {}, ["", "in", "out", "inout"].map(d => h("option", { value: d }, d || "(none)")));
    f.dir.value = e.direction || "";
    f.value = h("input", { value: e.value_text || "", placeholder: "e.g. 60 [L], true, \"text\"" });
    P.append(field("Type", f.type), field("Multiplicity", f.mult), field("Direction", f.dir), field("Value", f.value));
  }
  if (e.is_definition) {
    f.spec = h("input", { value: (e.specializes || []).join(", "), placeholder: "supertype id(s), comma-separated" });
    P.append(field("Specializes", f.spec));
  }
  f.doc = h("textarea", {}, e.doc || "");
  P.append(field("Documentation", f.doc));
  const save = async () => {
    const args = { element: e.id }, clear = [];
    if (f.name.value !== (e.name || "")) args.name = f.name.value;
    if (f.doc.value.trim() !== (e.doc || "")) f.doc.value.trim() ? args.doc = f.doc.value : clear.push("doc");
    if (f.type) {
      if (f.type.value !== (e.types?.[0] || "")) f.type.value ? args.type = f.type.value : clear.push("type");
      if (f.mult.value.trim() !== (e.multiplicity || "")) f.mult.value.trim() ? args.multiplicity = f.mult.value.trim() : clear.push("multiplicity");
      if (f.dir.value !== (e.direction || "")) f.dir.value ? args.direction = f.dir.value : clear.push("direction");
      if (f.value.value.trim() !== (e.value_text || "")) {
        const v = f.value.value.trim();
        if (!v) clear.push("value");
        else if (/^".*"$/.test(v)) { args.value = JSON.parse(v); args.value_kind = "string"; }
        else args.value = v;
      }
    }
    if (f.spec) {
      const now = f.spec.value.split(",").map(x => x.trim()).filter(Boolean);
      if (now.join(",") !== (e.specializes || []).join(",")) now.length ? args.specializes = now : clear.push("specializes");
    }
    if (clear.length) args.clear = clear;
    if (Object.keys(args).length === 1) return;
    const res = await mutate("update_element", args, "Saved");
    if (res.ok && res.updated) S.sel = res.updated, renderTree(), renderPane(), renderProps();
  };
  const del = async () => {
    if (!confirm(`Delete ${e.id} and everything it owns?`)) return;
    let res = await api("delete_element", { element: e.id });
    if (!res.ok && res.error.code === "has_dependents") {
      if (!confirm(formatError(res.error) + "\n\nDelete anyway and remove these references?")) return;
      res = await api("delete_element", { element: e.id, cascade: true });
    }
    if (!res.ok) { S.lastMsg = { err: true, text: formatError(res.error) }; renderProps(); return; }
    S.sel = e.owner; await refresh();
  };
  P.append(h("div", { class: "actions" }, h("button", { class: "primary", onclick: save }, "Apply"), h("button", { class: "danger", onclick: del }, "Delete")));
  if (S.lastMsg) P.append(h("div", { class: "msg " + (S.lastMsg.err ? "err" : "ok") }, S.lastMsg.text));

  // add child
  const kind = h("select", {}, KINDS.map(k => h("option", { value: k }, k)));
  kind.value = e.keyword === "package" ? "part def" : "part";
  const cname = h("input", { placeholder: "name" });
  const ctype = h("input", { placeholder: "type id (optional), e.g. Pkg.Engine", list: "typelist" });
  const dl = h("datalist", { id: "typelist" }, S.model.elements.filter(d => d.is_definition).map(d => h("option", { value: d.id })), ["Real", "Integer", "Boolean", "String"].map(t => h("option", { value: t })));
  const add = async () => {
    const args = { kind: kind.value, name: cname.value.trim(), owner: e.id };
    if (ctype.value.trim()) args.type = ctype.value.trim();
    const res = await mutate("create_element", args, null);
    if (res.ok) select(res.created);
  };
  P.append(h("h3", {}, "Add member"), field("Kind", kind), field("Name", cname), field("Type", ctype), dl,
    h("div", { class: "actions" }, h("button", { onclick: add }, "Add")));

  // members & relations
  if (e.members.length) P.append(h("h3", {}, "Members"), h("div", { class: "member-list" }, e.members.map(id => { const m = S.byId[id]; return h("div", { onclick: () => select(id) }, iconFor(m), " ", m.name, h("span", { class: "hint" }, typeLabel(m))); })));
  if (e.inherited_features?.length) P.append(h("h3", {}, "Inherited features"), h("div", { class: "member-list" }, e.inherited_features.map(x => h("div", { onclick: () => select(x.id), title: x.id }, x.name, h("span", { class: "hint" }, ` from ${x.declared_in.split(".").pop()}`)))));
  const rels = S.model.relations.filter(r => r.source === e.id || r.target === e.id);
  if (rels.length) P.append(h("h3", {}, "Relations"), h("div", { class: "member-list" }, rels.map(r => {
    const other = r.source === e.id ? r.target : r.source;
    return h("div", { onclick: () => select(other) }, r.source === e.id ? `→ ${r.type} ` : `← ${r.type} `, h("span", { class: "hint" }, other));
  })));
}

// -------------------------------------------------------------- toolbar
async function doUndo() { const r = await api("undo"); if (r.ok) refresh(); }
async function doRedo() { const r = await api("redo"); if (r.ok) refresh(); }
$("#undo").onclick = doUndo; $("#redo").onclick = doRedo;
$("#reload").onclick = async () => { await api("reload"); refresh(); };
$("#vbadge").onclick = () => document.querySelector('#tabs button[data-tab="valid"]').click();
$("#search").oninput = (ev) => { S.filter = ev.target.value; $("#results").replaceChildren(); renderTree(); };
$("#search").onkeydown = async (ev) => {
  if (ev.key === "Escape") { ev.target.value = ""; S.filter = ""; $("#results").replaceChildren(); renderTree(); return; }
  if (ev.key !== "Enter" || !ev.target.value.trim()) return;
  const box = $("#results");
  box.replaceChildren(h("div", { class: "hint" }, "Searching…"));
  const r = await api("find_elements", { query: ev.target.value.trim(), limit: 8 });
  box.replaceChildren();
  if (!r.ok) { box.append(h("div", { class: "msg err" }, formatError(r.error))); return; }
  S.filter = ""; renderTree();
  box.append(h("div", { class: "head" }, h("span", {}, `${r.results.length} result(s) · ${r.mode}`),
    h("span", { style: "cursor:pointer", onclick: () => box.replaceChildren() }, "✕")));
  if (r.note) box.append(h("div", { class: "hint" }, r.note));
  r.results.forEach(x => { const e = S.byId[x.id]; box.append(h("div", { class: "res", title: x.id, onclick: () => select(x.id) },
    e ? iconFor(e) : null, h("span", {}, x.name), h("span", { class: "score" }, String(Math.round(x.score))))); });
};
// Live view: pick up changes made by an agent (MCP), another tab or a git pull.
setInterval(async () => {
  if (!S.model || document.hidden) return;
  const busy = document.activeElement && document.activeElement.closest("#props, #pane") &&
    ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  if (busy) return;
  const r = await api("summary").catch(() => null);
  if (r && r.ok && r.version !== S.model.version) refresh();
}, 2000);
refresh();
</script>
</body>
