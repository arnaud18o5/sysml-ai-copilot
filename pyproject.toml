[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysml-copilot"
version = "0.2.0"
description = "Agent-controllable MBSE workbench for SysML v2 models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.1",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
graph = ["neo4j>=5.20", "fastembed>=0.3"]
dev = ["pytest>=8"]
eval = ["anthropic>=1.0", "mcp>=2.0"]
all = ["sysml-copilot[mcp,graph,dev,eval]"]

[project.scripts]
mbse = "sysml_copilot.cli:main"
mbse-mcp = "sysml_copilot.mcp_server:main"

[tool.setuptools.packages.find]
include = ["sysml_copilot*"]

[tool.setuptools.package-data]
sysml_copilot = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
